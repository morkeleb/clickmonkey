<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overflow</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.4 sans-serif; }
      header.chrome {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: #111;
        color: #fff;
        padding: 12px 16px;
      }
      main { padding: 64px 24px 24px; }
      .wide { width: 1400px; background: #f4f4f4; padding: 16px; }
      .phone { min-width: 400px; background: #f4f4f4; padding: 16px; }
      .reflow { min-width: 340px; background: #f4f4f4; padding: 16px; }
      .vw { width: 100vw; background: #f4f4f4; padding: 16px; }
      .scroll-wrap { overflow-x: auto; width: 100%; max-width: 100%; }
      .scroll-wrap table { width: 1600px; }
      .card { width: 480px; max-width: 480px; margin: 40px auto; background: #f4f4f4; padding: 16px; }
      .card .inner, .card table { width: auto; }
      .leak { width: 400px; margin: 40px auto; overflow: visible; background: #f4f4f4; padding: 16px; }
      .leak .inner { width: 520px; background: #ddd; }
      .fit { width: auto; max-width: 100%; }
      table { border-collapse: collapse; }
      th, td { text-align: left; padding: 4px 8px; }
      dialog { width: 320px; }
      .phone-dialog {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .phone-dialog.open { display: flex; }
      .fvs-dialog-surface {
        width: 280px;
        background: #fff;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .skrim-demo, .menu-demo { display: none; }
      .skrim-demo.open, .menu-demo.open { display: block; }
      .skrim-host {
        width: 400px;
        margin: 40px auto;
        position: relative;
        height: 80px;
        background: #f4f4f4;
      }
      .fvs-skrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .menu-host {
        width: 200px;
        margin: 40px auto;
        position: relative;
        background: #f4f4f4;
        padding: 8px;
      }
      .fvs-menu-surface {
        position: absolute;
        left: 0;
        top: 36px;
        width: 539px;
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px;
        z-index: 12;
      }
    </style>
  </head>
  <body>
    <header class="chrome">Workspace</header>
    <main data-testid="home">
      <div id="case" class="wide" data-testid="hero-grid">
        <h1>Hero grid</h1>
        <div class="inner">Projects and matters</div>
        <table>
          <thead>
            <tr><th>Matter</th><th>Status</th><th>Owner</th></tr>
          </thead>
          <tbody>
            <tr><td>Alpha</td><td>Open</td><td>Ada</td></tr>
          </tbody>
        </table>
      </div>
    </main>
    <dialog id="help">
      <p>Short help</p>
      <button type="button">Close</button>
    </dialog>
    <div id="phone-dialog" class="phone-dialog" data-testid="phone-dialog">
      <div class="fvs-dialog-surface" role="dialog" aria-modal="true" aria-label="Filter">
        <div class="fvs-text-field">
          <label>Name</label>
          <input type="text" />
        </div>
      </div>
    </div>
    <div id="skrim-demo" class="skrim-demo">
      <div class="skrim-host">
        <div class="fvs-skrim" data-testid="skrim"></div>
      </div>
    </div>
    <div id="menu-demo" class="menu-demo">
      <div class="menu-host">
        <input type="text" aria-label="Search" />
        <div class="fvs-menu-surface" data-testid="menu-surface">
          <div>Option A</div>
          <div>Option B</div>
        </div>
      </div>
    </div>
  </body>
</html>
