<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sparse form</title>
    <style>
      body { margin: 0; font: 16px/1.4 sans-serif; }
      .shell { display: flex; min-height: 100vh; }
      nav { width: 220px; flex: 0 0 220px; background: #111; color: #fff; padding: 16px; box-sizing: border-box; }
      main { flex: 1; padding: 24px; box-sizing: border-box; }
      form.narrow { max-width: 28%; }
      form.half { max-width: 50%; }
      form.centered { max-width: 28%; margin: 0 auto; }
      form.full { max-width: none; width: 100%; }
      label, input { display: block; width: 100%; box-sizing: border-box; }
      input { margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav>Workspace</nav>
      <main data-testid="home">
        <h1>New vendor</h1>
        <form class="narrow" data-testid="vendor-form">
          <label>Legal name <input name="legal" /></label>
          <label>Tax ID <input name="tax" /></label>
          <label>Phone <input name="phone" /></label>
          <label>City <input name="city" /></label>
          <label>Notes <input name="notes" /></label>
          <button type="submit">Save</button>
        </form>
      </main>
    </div>
  </body>
</html>
