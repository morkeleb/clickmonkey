<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>List scanline</title>
    <style>
      body { font: 16px/1.4 sans-serif; margin: 24px; }
      nav.menubar { display: flex; gap: 16px; margin-bottom: 24px; }
      .threads { display: flex; flex-direction: column; gap: 8px; width: 360px; }
      .threads [role="listitem"] { height: 32px; display: flex; align-items: center; }
      .threads [role="listitem"] a { display: block; padding-left: 8px; }
      .threads [role="listitem"]:nth-child(2) a { padding-left: 48px; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
        width: 720px;
        margin: 24px 0;
      }
      .card { border: 1px solid #ddd; padding: 12px; min-height: 72px; }
      table { border-collapse: collapse; width: 640px; margin-top: 24px; }
      th, td { border-bottom: 1px solid #ddd; padding: 8px 12px; }
      .drift tbody tr:nth-child(2) td.vendor { padding-left: 40px; }
      [role="menu"] { margin: 24px 0; padding: 8px; border: 1px solid #ccc; width: 240px; }
      [role="menuitem"] a { display: block; padding-left: 8px; }
      [role="menuitem"]:nth-child(2) a { padding-left: 48px; }
    </style>
  </head>
  <body>
    <main data-testid="home">
      <nav class="menubar" aria-label="Primary">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#team">Team</a>
        <a href="#help">Help</a>
      </nav>
      <h1>Inbox</h1>
      <div role="list" class="threads" aria-label="Threads" data-testid="threads">
        <div role="listitem"><a href="#1">Alpha thread</a></div>
        <div role="listitem"><a href="#2">Beta thread</a></div>
        <div role="listitem"><a href="#3">Gamma thread</a></div>
        <div role="listitem"><a href="#4">Delta thread</a></div>
      </div>
      <h2>Cards</h2>
      <div class="grid" data-testid="cards">
        <article class="card"><h3>One</h3></article>
        <article class="card"><h3>Two</h3></article>
        <article class="card"><h3>Three</h3></article>
        <article class="card"><h3>Four</h3></article>
        <article class="card"><h3>Five</h3></article>
        <article class="card"><h3>Six</h3></article>
      </div>
      <table class="drift" data-testid="drift">
        <caption>Ragged titles</caption>
        <thead>
          <tr><th>Voucher</th><th>Vendor</th><th>Reference</th></tr>
        </thead>
        <tbody>
          <tr><td>VCH-4</td><td class="vendor">Alpha</td><td>A-1</td></tr>
          <tr><td>VCH-5</td><td class="vendor">Beta</td><td>B-1</td></tr>
          <tr><td>VCH-6</td><td class="vendor">Gamma</td><td>C-1</td></tr>
        </tbody>
      </table>
      <ul role="menu" aria-label="Overflow">
        <li role="menuitem"><a href="#m1">Short</a></li>
        <li role="menuitem"><a href="#m2">Padded</a></li>
        <li role="menuitem"><a href="#m3">Also</a></li>
        <li role="menuitem"><a href="#m4">More</a></li>
      </ul>
    </main>
  </body>
</html>
