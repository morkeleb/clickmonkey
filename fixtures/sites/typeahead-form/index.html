<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Typeahead form</title>
  </head>
  <body>
    <main data-testid="home">
      <form id="create">
        <label for="country">Country</label>
        <input
          id="country"
          name="country"
          data-testid="country"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="country-list"
          autocomplete="off"
          required
        />
        <ul id="country-list" role="listbox" hidden>
          <li role="option">Norway</li>
          <li role="option">Sweden</li>
          <li role="option">Denmark</li>
        </ul>
        <input type="hidden" name="countryId" id="countryId" />

        <label for="people">People</label>
        <div
          id="people-wrap"
          role="combobox"
          aria-expanded="false"
          aria-haspopup="listbox"
          aria-controls="people-list"
        >
          <input id="people" name="people" data-testid="people" autocomplete="off" aria-label="People" />
        </div>
        <ul id="people-list" role="listbox" hidden>
          <li role="option">Alice</li>
          <li role="option">Bob</li>
          <li role="option">Sam</li>
        </ul>
        <input type="hidden" name="peopleId" id="peopleId" />

        <label for="city">City</label>
        <input id="city" name="city" data-testid="city" list="city-list" />
        <datalist id="city-list">
          <option value="Oslo"></option>
          <option value="Bergen"></option>
          <option value="Tromsø"></option>
        </datalist>

        <label for="industry">Industry</label>
        <input
          id="industry"
          name="industry"
          data-testid="industry"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="industry-list"
          autocomplete="off"
        />
        <ul id="industry-list" role="listbox" hidden>
          <li role="option">111110 — Soybean Farming</li>
          <li role="option">111120 — Oilseed (except Soybean) Farming</li>
          <li role="option">111150 — Corn Farming</li>
        </ul>
        <input type="hidden" name="industryId" id="industryId" />

        <label for="vendor">Vendor</label>
        <input
          id="vendor"
          name="vendor"
          data-testid="vendor"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="vendor-list"
          autocomplete="off"
        />
        <div id="vendor-list" role="menu" hidden>
          <button type="button">Acme Supplies</button>
          <button type="button">Seed Office</button>
          <button type="button">FV Admin — 1</button>
        </div>
        <input type="hidden" name="vendorId" id="vendorId" />

        <label for="matter">Matter</label>
        <input
          id="matter"
          name="matter"
          data-testid="matter"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="matter-list"
          autocomplete="off"
        />
        <div id="matter-list" role="listbox" hidden></div>
        <input type="hidden" name="matterId" id="matterId" />

        <label for="empty-vendor">Empty vendor</label>
        <input
          id="empty-vendor"
          name="emptyVendor"
          data-testid="empty-vendor"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="empty-vendor-list"
          autocomplete="off"
        />
        <div id="empty-vendor-list" role="listbox" hidden>
          <div>No vendors found</div>
        </div>

        <label for="party">Party</label>
        <input
          id="party"
          name="party"
          data-testid="party"
          role="combobox"
          placeholder="Select a party"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="party-list"
          autocomplete="off"
          required
        />
        <div id="party-list" role="listbox" hidden>
          <div>No parties found</div>
        </div>

        <label for="ownerid">Owner</label>
        <input
          id="ownerid"
          name="ownerid"
          data-testid="ownerid"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="ownerid-list"
          autocomplete="off"
        />
        <div id="ownerid-list" role="listbox" hidden>
          <div>No owners found</div>
        </div>

        <label for="region">Region</label>
        <input
          id="region"
          name="region"
          data-testid="region"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="region-list"
          autocomplete="off"
        />
        <ul id="region-list" role="listbox" hidden>
          <li role="option" style="pointer-events: none"><span>North</span></li>
          <li role="option" style="pointer-events: none"><span>South</span></li>
        </ul>
        <input type="hidden" name="regionId" id="regionId" />

        <button type="submit" data-testid="submit">Create</button>
      </form>
    </main>
    <script>
      document.body.appendChild(document.getElementById("people-list"));
      document.body.appendChild(document.getElementById("industry-list"));

      function bindSearch(opts) {
        const { input, list, hid, wrap, debounceMs } = opts;
        const all = [...list.querySelectorAll("[role=option]")];
        let timer;
        function open(filter) {
          const q = (filter || "").trim().toLowerCase();
          let n = 0;
          for (const o of all) {
            const show = q.length > 0 && o.textContent.toLowerCase().includes(q);
            o.hidden = !show;
            if (show) n++;
          }
          list.hidden = n === 0;
          input.setAttribute("aria-expanded", String(n > 0));
          wrap?.setAttribute("aria-expanded", String(n > 0));
        }
        input.addEventListener("focus", () => open(input.value));
        input.addEventListener("input", () => {
          hid.value = "";
          clearTimeout(timer);
          timer = setTimeout(() => open(input.value), debounceMs);
        });
        list.addEventListener("mousedown", (e) => {
          const o = e.target.closest("[role=option]");
          if (!o) return;
          e.preventDefault();
          input.value = o.textContent.trim();
          hid.value = o.textContent.trim();
          list.hidden = true;
          input.setAttribute("aria-expanded", "false");
          wrap?.setAttribute("aria-expanded", "false");
        });
      }

      bindSearch({
        input: document.getElementById("country"),
        list: document.getElementById("country-list"),
        hid: document.getElementById("countryId"),
        debounceMs: 200,
      });
      bindSearch({
        input: document.getElementById("people"),
        list: document.getElementById("people-list"),
        hid: document.getElementById("peopleId"),
        wrap: document.getElementById("people-wrap"),
        debounceMs: 300,
      });

      (function bindMatter() {
        const input = document.getElementById("matter");
        const list = document.getElementById("matter-list");
        const hid = document.getElementById("matterId");
        const names = ["Alpha Matter", "Beta Matter", "Gamma Matter"];
        names.forEach((name) => {
          const row = document.createElement("div");
          row.textContent = name;
          row.addEventListener("click", () => {
            input.value = name;
            hid.value = name;
            list.hidden = true;
            input.setAttribute("aria-expanded", "false");
          });
          list.appendChild(row);
        });
        function open() {
          list.hidden = false;
          input.setAttribute("aria-expanded", "true");
        }
        input.addEventListener("focus", open);
        input.addEventListener("input", open);
      })();

      (function bindVendor() {
        const input = document.getElementById("vendor");
        const list = document.getElementById("vendor-list");
        const hid = document.getElementById("vendorId");
        function open() {
          list.hidden = false;
          input.setAttribute("aria-expanded", "true");
        }
        input.addEventListener("focus", open);
        input.addEventListener("input", open);
        list.addEventListener("mousedown", (e) => {
          const o = e.target.closest("button");
          if (!o) return;
          e.preventDefault();
          input.value = o.textContent.trim();
          hid.value = o.textContent.trim();
          list.hidden = true;
          input.setAttribute("aria-expanded", "false");
        });
      })();

      function bindEmptyList(id, listId) {
        const input = document.getElementById(id);
        const list = document.getElementById(listId);
        function open() {
          list.hidden = false;
          input.setAttribute("aria-expanded", "true");
        }
        input.addEventListener("focus", open);
        input.addEventListener("input", open);
      }
      bindEmptyList("empty-vendor", "empty-vendor-list");
      bindEmptyList("party", "party-list");
      bindEmptyList("ownerid", "ownerid-list");

      (function bindRegion() {
        const input = document.getElementById("region");
        const list = document.getElementById("region-list");
        const hid = document.getElementById("regionId");
        function open() {
          list.hidden = false;
          input.setAttribute("aria-expanded", "true");
        }
        input.addEventListener("focus", open);
        input.addEventListener("input", open);
        list.addEventListener("mousedown", (e) => {
          const o = e.target.closest("[role=option]");
          if (!o) return;
          e.preventDefault();
          input.value = o.textContent.trim();
          hid.value = o.textContent.trim();
          list.hidden = true;
          input.setAttribute("aria-expanded", "false");
        });
      })();

      (function bindIndustry() {
        const input = document.getElementById("industry");
        const list = document.getElementById("industry-list");
        const hid = document.getElementById("industryId");
        const all = [...list.querySelectorAll("[role=option]")];
        let timer;
        // searchOnEmpty: server list paints after ~600ms (longer than a 500ms open wait).
        function open() {
          clearTimeout(timer);
          timer = setTimeout(() => {
            for (const o of all) o.hidden = false;
            list.hidden = false;
            input.setAttribute("aria-expanded", "true");
          }, 600);
        }
        input.addEventListener("focus", open);
        input.addEventListener("input", open);
        list.addEventListener("mousedown", (e) => {
          const o = e.target.closest("[role=option]");
          if (!o) return;
          e.preventDefault();
          input.value = o.textContent.trim();
          hid.value = o.textContent.trim();
          list.hidden = true;
          input.setAttribute("aria-expanded", "false");
        });
      })();

      document.getElementById("create").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!document.getElementById("countryId").value) {
          document.getElementById("country").setAttribute("aria-invalid", "true");
          return;
        }
        location.href = "/ok.html";
      });
    </script>
  </body>
</html>
